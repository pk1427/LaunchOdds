[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Monad execution environment (requires Foundry v1.8+).
# See https://docs.monad.xyz/tooling-and-infra/toolkits/foundry
network = "monad"
solc = "0.8.30"
# Monad is EVM bytecode-compatible through the Osaka fork.
# See https://docs.monad.xyz/guides/evm-resources/solidity-resources
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
auto_detect_solc = false
fs_permissions = [{ access = "read-write", path = "./abi" }, { access = "read-write", path = "./out" }]
